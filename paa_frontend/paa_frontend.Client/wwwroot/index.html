<!DOCTYPE html>
<html lang="en" style="background-color: #f2f3f7;">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PrimeApp Demo academic management portal" />
    <meta name="application-name" content="PrimeApp Demo" />
    <meta name="apple-mobile-web-app-title" content="PrimeApp Demo" />
    <title>PrimeApp Demo</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="/images/demo-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Outfit', 'system-ui', '-apple-system', 'sans-serif'],
                            mono: ['JetBrains Mono', 'monospace']
                        },
                        colors: {
                            primary: {
                                DEFAULT: '#1A56DB',
                                dark:    '#1239A0',
                                mid:     '#2563EB',
                                light:   '#EBF5FF',
                            },
                            accent: {
                                DEFAULT: '#60A5FA',
                                light:   '#BFDBFE',
                            }
                        },
                        boxShadow: {
                            blue: '0 4px 20px rgba(26,86,219,0.20)',
                        }
                    }
                }
            }
        } else {
            console.error("Tailwind CSS Play CDN failed to load.");
        }

        window.setNimbusIdentity = function (name) {
            const appName = name || 'PrimeApp Demo';
            document.title = appName;
            document.querySelectorAll('meta[name="application-name"], meta[name="apple-mobile-web-app-title"]')
                .forEach(meta => meta.setAttribute('content', appName));
        };

        window.paaForms = {
            focusFirstInvalidField: function (formId) {
                const form = document.getElementById(formId);
                if (!form) return;

                const target = form.querySelector("input[aria-invalid='true'], select[aria-invalid='true'], textarea[aria-invalid='true'], .invalid");
                if (!target) return;

                target.scrollIntoView({ behavior: "smooth", block: "center" });
                if (typeof target.focus === "function") {
                    target.focus({ preventScroll: true });
                }
            },
            focusSection: function (elementId) {
                const target = document.getElementById(elementId);
                if (!target) return;

                target.scrollIntoView({ behavior: "smooth", block: "start" });
                if (typeof target.focus === "function") {
                    target.focus({ preventScroll: true });
                }
            }
        };
    </script>
    <style>
        .app-loading {
            position: fixed;
            inset: 0;
            background-color: #F8FAFC;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: 'Outfit', sans-serif;
            transform: translateZ(0);
        }

        .layout-spray-bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background: #F8FAFC;
        }

        .layout-spray-bg::before,
        .layout-spray-bg::after {
            content: '';
            position: absolute;
            inset: -12%;
            pointer-events: none;
        }

        .layout-spray-bg::before {
            background-image:
                radial-gradient(circle at 8% 16%, rgba(15, 23, 42, 0.09) 0 1px, transparent 1.6px),
                radial-gradient(circle at 24% 74%, rgba(30, 64, 175, 0.055) 0 1.2px, transparent 1.8px),
                radial-gradient(circle at 58% 28%, rgba(15, 23, 42, 0.065) 0 1px, transparent 1.7px),
                radial-gradient(circle at 86% 68%, rgba(5, 150, 105, 0.06) 0 1.3px, transparent 1.9px),
                radial-gradient(circle at 72% 92%, rgba(15, 23, 42, 0.05) 0 1px, transparent 1.5px);
            background-size: 180px 160px, 230px 210px, 260px 190px, 210px 240px, 310px 260px;
            opacity: 0.42;
        }

        .layout-spray-bg::after {
            background-image:
                radial-gradient(circle at 17% 42%, rgba(15, 23, 42, 0.035) 0 2px, transparent 3px),
                radial-gradient(circle at 46% 83%, rgba(30, 64, 175, 0.03) 0 2.2px, transparent 3.2px),
                radial-gradient(circle at 91% 24%, rgba(5, 150, 105, 0.035) 0 1.8px, transparent 3px);
            background-size: 300px 260px, 360px 300px, 330px 280px;
            opacity: 0.3;
            filter: blur(0.25px);
        }
        .app-logo-wrap {
            width: 140px;
            height: 140px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1.5px solid rgba(15, 23, 42, 0.06);
            animation: app-logo-bob 3s ease-in-out infinite alternate;
            will-change: transform;
        }
        .app-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .app-school-name {
            font-size: 22px;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.6px;
            margin-bottom: 24px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }
        .loading-cartoon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .app-loading-sub {
            margin-top: 14px;
            font-size: 13px;
            color: #64748B;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        @keyframes app-logo-bob {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-10px); }
        }
        @keyframes pencil-write {
            0%   { transform: rotate(-8deg) translateY(0px); }
            25%  { transform: rotate(-5deg) translateY(-5px); }
            50%  { transform: rotate(-8deg) translateY(0px); }
            75%  { transform: rotate(-11deg) translateY(-3px); }
            100% { transform: rotate(-8deg) translateY(0px); }
        }
        @keyframes pencil-tip-glow {
            0%, 100% { opacity: 0.4; r: 3px; }
            50%       { opacity: 1;   r: 5px; }
        }
        @keyframes dot-bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
            40%            { transform: translateY(-8px); opacity: 1; }
        }
        .pencil-anim {
            animation: pencil-write 1.6s ease-in-out infinite;
            transform-origin: center bottom;
        }
        .pencil-tip-dot {
            animation: pencil-tip-glow 1.6s ease-in-out infinite;
        }
        .bounce-dot {
            animation: dot-bounce 1.4s ease-in-out infinite;
        }
        .bounce-dot:nth-child(2) { animation-delay: 0.2s; }
        .bounce-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="bg-[#f2f3f7] font-sans antialiased h-full">
    <div id="app" class="h-full">
        <div class="app-loading">
            <div class="app-logo-wrap" style="padding: 12px;">
                <img src="/images/demo-logo.svg" alt="PrimeApp Demo" />
            </div>
            <div class="app-school-name">PrimeApp Demo</div>
            <!-- Animated Pencil -->
            <div class="loading-cartoon-wrap" style="margin-bottom: 6px;">
                <svg class="pencil-anim" viewBox="0 0 40 110" width="40" height="110" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Eraser top -->
                    <rect x="10" y="0" width="20" height="10" rx="4" fill="#f87171"/>
                    <!-- Eraser band -->
                    <rect x="10" y="10" width="20" height="5" fill="#fca5a5"/>
                    <!-- Metal ferrule -->
                    <rect x="10" y="15" width="20" height="6" fill="#94a3b8"/>
                    <!-- Pencil body -->
                    <rect x="10" y="21" width="20" height="62" fill="#fbbf24"/>
                    <!-- Side shading stripe -->
                    <rect x="10" y="21" width="5" height="62" fill="#f59e0b" opacity="0.5"/>
                    <!-- Wood cone -->
                    <polygon points="10,83 30,83 20,102" fill="#d97706"/>
                    <!-- Graphite tip -->
                    <polygon points="15,95 25,95 20,102" fill="#374151"/>
                    <!-- Glint on body -->
                    <rect x="27" y="26" width="2" height="50" rx="1" fill="white" opacity="0.35"/>
                    <!-- Writing tip glow dot -->
                    <circle class="pencil-tip-dot" cx="20" cy="104" r="3" fill="#2563eb" opacity="0.5"/>
                </svg>
            </div>
            <!-- Bouncing dots -->
            <div style="display:flex; gap:6px; justify-content:center; margin-bottom:14px;">
                <div class="bounce-dot" style="width:7px;height:7px;border-radius:50%;background:#2563eb;"></div>
                <div class="bounce-dot" style="width:7px;height:7px;border-radius:50%;background:#2563eb;"></div>
                <div class="bounce-dot" style="width:7px;height:7px;border-radius:50%;background:#2563eb;"></div>
            </div>
            <div class="app-loading-sub">Initializing secure session...</div>
        </div>
    </div>
    <script src="/js/student-pass-scanner.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
