name: Blazor Hosted Demo CI/CD

on:
  push:
    branches: ["devBranch"]
  pull_request:
    branches: ["devBranch"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore paa_frontend.sln
      - name: Build solution
        run: dotnet build paa_frontend.sln --no-restore --configuration Release
      - name: Run tests
        run: dotnet test paa_frontend.sln --no-build --configuration Release --verbosity normal

  deploy-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/devBranch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/paa-frontend-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/paa-frontend-demo:${{ github.sha }}

  deploy-railway:
    needs: deploy-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/devBranch'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Redeploy demo on Railway
        run: railway redeploy --service=paa-frontend-demo -y
